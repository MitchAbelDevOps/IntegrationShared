name: ".infra-rg-shared-mitchtest-orchestration-workflow"

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "The environment to deploy (e.g., dev, tst, stg, pwe, prd)"
        required: true
        type: string

jobs:
  deploy_resource_group:
    permissions:
      id-token: write # Required for OIDC authentication
      contents: read # To access repository files if needed
    uses: ./.github/workflows/infra-rg-shared-mitchtest-workflow.yaml
    with:
      environment: ${{ github.event.inputs.environment }}
    secrets: inherit

  deploy_uami:
    permissions:
      id-token: write # Required for OIDC authentication
      contents: read # To access repository files if needed
    uses: ./.github/workflows/infra-uami-mitchtest-workflow.yaml
    with:
      environment: ${{ github.event.inputs.environment }}
    needs: deploy_resource_group # Ensures this job runs after deploy_resource_group
    secrets: inherit

  deploy_actiongroups:
    permissions:
      id-token: write # Required for OIDC authentication
      contents: read  # To access repository files if needed
    uses: ./.github/workflows/infra-alerts-mitchtest-workflow.yaml
    with:
      environment: ${{ github.event.inputs.environment }}
    needs: deploy_resource_group
    secrets: inherit

  deploy_asp_logic:
    permissions:
      id-token: write # Required for OIDC authentication
      contents: read  # To access repository files if needed
    uses: ./.github/workflows/infra-asp-logicapps-mitchtest-workflow.yaml
    with:
      environment: ${{ github.event.inputs.environment }}
    needs: deploy_actiongroups
    secrets: inherit

  deploy_asp_function:
    permissions:
      id-token: write # Required for OIDC authentication
      contents: read  # To access repository files if needed
    uses: ./.github/workflows/infra-asp-functionapps-mitchtest-workflow.yaml
    with:
      environment: ${{ github.event.inputs.environment }}
    needs: deploy_actiongroups
    secrets: inherit

  deploy_kv:
    permissions:
      id-token: write # Required for OIDC authentication
      contents: read # To access repository files if needed
    uses: ./.github/workflows/infra-kv-mitchtest-workflow.yaml
    with:
      environment: ${{ github.event.inputs.environment }}
    needs: deploy_uami
    secrets: inherit

  deploy_sb:
    permissions:
      id-token: write # Required for OIDC authentication
      contents: read # To access repository files if needed
    uses: ./.github/workflows/infra-sb-mitchtest-workflow.yaml
    with:
      environment: ${{ github.event.inputs.environment }}
    needs: deploy_uami
    secrets: inherit

  deploy_appi:
    permissions:
      id-token: write # Required for OIDC authentication
      contents: read # To access repository files if needed
    uses: ./.github/workflows/infra-appi-mitchtest-workflow.yaml
    with:
      environment: ${{ github.event.inputs.environment }}
    needs: deploy_uami
    secrets: inherit
